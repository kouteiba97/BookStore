# Render Blueprint — deploys all three pieces of BookStore.
# Import via Render dashboard → "New" → "Blueprint" and point at this repo.
# Secrets (sync: false) are entered once in the dashboard; JWT_SECRET is
# auto-generated. After the first deploy, seed the store row once:
#   render shell bookstore-api  →  npm run prisma:seed
services:
  # ── NestJS API (Docker) ──────────────────────────────────────────────────
  - type: web
    name: bookstore-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL          # Neon pooled connection string
        sync: false
      - key: DIRECT_URL            # Neon direct connection (for migrations)
        sync: false
      - key: JWT_SECRET            # auto-generated, never shown
        generateValue: true
      - key: ADMIN_PASSWORD        # shared admin login
        sync: false
      - key: STORE_SLUG
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: CORS_ORIGINS          # storefront + admin origins (comma-separated)
        sync: false
      - key: STOREFRONT_URL        # public storefront origin; links books in social exports (optional)
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      # ── Social auto-posting (see docs/social-autopost.md) ──
      - key: SOCIAL_TOKEN_KEY      # encrypts the Meta token in the database; auto-generated
        generateValue: true
      - key: META_APP_ID           # optional: lets the server renew an expiring token itself
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN    # optional: alerts when a person must act
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: HEALTHCHECK_TICK_URL     # optional: healthchecks.io check, period 10 min, grace 30 min
        sync: false
      - key: HEALTHCHECK_PUBLISH_URL  # optional: healthchecks.io check, period 1 day, grace 1 day
        sync: false

  # ── Social auto-poster: OPTIONAL paid backup (≈ $1/month) ────────────────
  # Auto-posting already runs inside bookstore-api every 10 min (free; the API
  # keeps itself awake — src/common/keep-alive.ts). Uncomment this Cron Job to
  # also run it from outside, so posting continues even if the API is down.
  # Both together are safe: a database lease lets only one run work at a time.
  # - type: cron
  #   name: bookstore-social-tick
  #   runtime: docker
  #   dockerfilePath: ./Dockerfile
  #   dockerCommand: node dist/social-tick.js
  #   plan: starter
  #   schedule: "*/10 * * * *"
  #   envVars:
  #     - key: DATABASE_URL
  #       fromService: { type: web, name: bookstore-api, envVarKey: DATABASE_URL }
  #     - key: STORE_SLUG
  #       fromService: { type: web, name: bookstore-api, envVarKey: STORE_SLUG }
  #     - key: WHATSAPP_NUMBER
  #       fromService: { type: web, name: bookstore-api, envVarKey: WHATSAPP_NUMBER }
  #     - key: STOREFRONT_URL
  #       fromService: { type: web, name: bookstore-api, envVarKey: STOREFRONT_URL }
  #     - key: SOCIAL_TOKEN_KEY
  #       fromService: { type: web, name: bookstore-api, envVarKey: SOCIAL_TOKEN_KEY }
  #     - key: META_APP_ID
  #       fromService: { type: web, name: bookstore-api, envVarKey: META_APP_ID }
  #     - key: META_APP_SECRET
  #       fromService: { type: web, name: bookstore-api, envVarKey: META_APP_SECRET }
  #     - key: TELEGRAM_BOT_TOKEN
  #       fromService: { type: web, name: bookstore-api, envVarKey: TELEGRAM_BOT_TOKEN }
  #     - key: TELEGRAM_CHAT_ID
  #       fromService: { type: web, name: bookstore-api, envVarKey: TELEGRAM_CHAT_ID }
  #     - key: R2_ACCOUNT_ID
  #       fromService: { type: web, name: bookstore-api, envVarKey: R2_ACCOUNT_ID }
  #     - key: R2_ACCESS_KEY_ID
  #       fromService: { type: web, name: bookstore-api, envVarKey: R2_ACCESS_KEY_ID }
  #     - key: R2_SECRET_ACCESS_KEY
  #       fromService: { type: web, name: bookstore-api, envVarKey: R2_SECRET_ACCESS_KEY }
  #     - key: R2_BUCKET
  #       fromService: { type: web, name: bookstore-api, envVarKey: R2_BUCKET }
  #     - key: R2_PUBLIC_BASE_URL
  #       fromService: { type: web, name: bookstore-api, envVarKey: R2_PUBLIC_BASE_URL }
  #     - key: HEALTHCHECK_TICK_URL
  #       fromService: { type: web, name: bookstore-api, envVarKey: HEALTHCHECK_TICK_URL }
  #     - key: HEALTHCHECK_PUBLISH_URL
  #       fromService: { type: web, name: bookstore-api, envVarKey: HEALTHCHECK_PUBLISH_URL }

  # ── Public storefront (static SPA) ───────────────────────────────────────
  - type: web
    name: bookstore-storefront
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL          # https://bookstore-api.onrender.com
        sync: false
      - key: VITE_STORE_SLUG
        sync: false
      - key: VITE_WHATSAPP_NUMBER
        sync: false
      - key: VITE_EDITION          # "basic" hides academic browse; "full" shows everything
        value: basic
    headers:
      # Built files carry a content hash in their name, so they never change:
      # let browsers keep them a year instead of re-checking on every visit.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Force HTTPS for a year, including subdomains. Render already redirects
      # http -> https; this stops the browser attempting http at all.
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=(), interest-cohort=()
      # script-src 'self' is the part that matters: no injected or third-party
      # script can run. img/connect stay scheme-broad so changing the image CDN
      # or API hostname cannot silently break the shop.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https:; frame-src https://www.google.com https://maps.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Admin dashboard (static SPA, served at /admin) ───────────────────────
  - type: web
    name: bookstore-admin
    runtime: static
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL          # https://bookstore-api.onrender.com
        sync: false
      - key: VITE_BASE_PATH        # "/" for a dedicated subdomain on Render
        value: /
      - key: VITE_PUBLIC_SITE_URL  # link back to the storefront
        sync: false
      - key: VITE_EDITION          # "basic" hides the academic screen; "full" shows everything
        value: basic
    headers:
      # Built files carry a content hash in their name, so they never change:
      # let browsers keep them a year instead of re-checking on every visit.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Force HTTPS for a year, including subdomains. Render already redirects
      # http -> https; this stops the browser attempting http at all.
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=(), interest-cohort=()
      # script-src 'self' is the part that matters: no injected or third-party
      # script can run. img/connect stay scheme-broad so changing the image CDN
      # or API hostname cannot silently break the shop.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
